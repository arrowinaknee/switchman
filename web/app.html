<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Switchman settings</title>
	<link rel="icon" type="image/x-icon" href="img/favicon.png">
	<script language="javascript" type="text/javascript"
		src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"></script>
	<link rel="stylesheet" type="text/css"
		href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css">
	<link rel="stylesheet" type="text/css"
		href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/theme/material-darker.min.css">

	<!-- The script fails to load for some reason -->
	<!-- <script language="javascript" type="application/javascript" src="https://codemirror.net/5/addon/mode/simple.js"></script> -->
	<script language="javascript" type="application/javascript" src="codemirror/simple.js"></script>
	<script language="javascript" type="text/javascript" src="codemirror/mode-switchman.js"></script>

	<link rel="stylesheet" href="style.css">
	<script src="app.js" defer></script>
</head>

<body class="row">
	<div id="sidebar" class="col">
		<div id="header">
			<p>
				<img id="logo" src="img/icon-white.svg" draggable="false">
				Switchman
			</p>
		</div>
		<div id="menu" class="col grow scroll">
			<button class="menu-item" onclick="showPanelCode()">
				<p>Server</p>
			</button>
			<div class="menu-group col">
				<button>
					<p>Settings</p>
				</button>

				<button class="menu-item" onclick="showPanelUsers()">
					<p>Users</p>
				</button>
				<button>
					<p>API</p>
				</button>
			</div>
		</div>
	</div>
	<div id="panel-mount" class="col grow">
		<div id="panel-code" class="col grow active">
			<div id="code-hook" class="grow"></div>
			<!-- <textarea id="code" class="grow" spellcheck="false"></textarea> -->
			<div id="code-bottom" class="row">
				<p id="status" class="grow"></p>
				<button id="check" class="flat" onclick="pressVerify()">Check</button>
				<button id="apply" class="flat" onclick="pressApply()">Apply</button>
			</div>
		</div>
		<div id="panel-users" class="col grow scroll panel active">
			<table id="user-list">
				<tr class="static">
					<td><h3 class="grow">Users</h3></td>
					<td></td>
					<td class="filled"><button class="accent" onclick="showCreateUser()">+ Add</button></td>
				</tr>
				<tr class="hover-bg clickable">
					<td>admin</td>
					<td>Enabled</td>
					<td class="phover row-button">Manage ></td>
				</tr>
				<tr class="hover-bg clickable">
					<td>user</td>
					<td>Enabled</td>
					<td class="phover row-button">Manage ></td>
				</tr>
			</table>
		</div>
		<div id="panel-newuser" class="col grow scroll panel active">
			<table>
				<tr>
					<td><label for="newuser-login">Login</label></td>
					<td><input id="newuser-login" type="text" placeholder="Login"></td>
				</tr>
				<tr>
					<td><label for="newuser-password">Password</label></td>
					<td><input id="newuser-password" type="password" placeholder="Password"></td>
				</tr>
				<tr>
					<td><label for="newuser-password-confirm">Confirm password</label></td>
					<td><input id="newuser-password-confirm" type="password" placeholder="Confirm password"></td>
				</tr>
				<tr>
					<td colspan="2"><p id="newuser-status">awdawsdawsdawsdwasdwasdawsdawsdwsdaw</p></td>
				</tr>
				<tr>
					<td colspan="2"><div class="row end"><button class="accent" onclick="userCreate()">Create</button></div></td>
				</tr>
			</table>
		</div>
		<div id="panel-user" class="panel">
			<h4>Login details</h4>
			<table>
				<tr>
					<td><label for="user-login">Login</label></td>
					<td><input type="text" id="user-login" placeholder="New login" oninput="userLoginRefresh()"></td>
					<td><p><!--Username already taken--></p></td>
				</tr>
				<tr>
					<td colspan="2"></td>
					<td><div class="row end"><button id="user-login-update" onclick="setLogin()">Update</button></td>
				</tr>
				<tr><td colspan="3"><hr></td></tr>
				<tr>
					<td><label for="user-password">Password</label></td>
					<td><input type="password" id="user-password" placeholder="New password"></td>
				</tr>
				<tr>
					<td><label for="user-password-confirm">Confirm password</label></td>
					<td><input type="password" id="user-password-confirm" placeholder="Confirm password"></td>
				</tr>
				<tr>
					<td colspan="2"></td>
					<td><div class="row end" id="user-password-update"><button disabled>Update</button></div></td>
				</tr>
			</table>
		</div>
	</div>
	<!-- <div>
		<label>Login</label>
		<input id="login" type="text">
		<label>Password</label>
		<input id="password" type="password">
		<button id="login_button" onclick="pressLogin()">Log in</button>
	</div> -->
</body>

</html>
